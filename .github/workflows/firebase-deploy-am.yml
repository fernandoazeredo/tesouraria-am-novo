name: Deploy Firebase - AM NOVO
# Deploy controlado e isolado do projeto tesouraria-am-novo
# Reexecucao apos ajuste de permissoes IAM
# Publicacao das correcoes aprovadas de identidade e textos AM

on:
  push:
    branches:
      - dev-am-2026-09-08
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-firebase]')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-package-lock

      - name: Gerar build
        run: npm run build

      - name: Autenticar no Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TESOURARIA_AM_NOVO }}

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Publicar Firestore, Storage e Hosting do AM NOVO
        run: firebase deploy --only firestore:rules,firestore:indexes,storage,hosting --project tesouraria-am-novo --non-interactive